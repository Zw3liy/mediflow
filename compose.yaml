services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    profiles:
      - optional-storage
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    profiles:
      - optional-storage
    restart: unless-stopped
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9001:9001"


  web:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_PRODUCTION: ${DJANGO_PRODUCTION:-True}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      DOCUMENT_STORAGE_ROOT: /app/private_documents
    command:
      - sh
      - -c
      - case "$$DJANGO_PRODUCTION" in True|true|TRUE|1|yes|YES) python manage.py check_production || exit 1;; esac; python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 60 --limit-request-line 4094 --limit-request-fields 100 --limit-request-field_size 8190
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    volumes:
      - private_documents:/app/private_documents
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; request=urllib.request.Request('http://127.0.0.1:8000/health/ready/', headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(request, timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test:
        - CMD-SHELL
        - clamdscan --ping 1 >/dev/null 2>&1
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  backup:
    image: postgres:16-alpine
    profiles:
      - operations
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups
      - private_documents:/private_documents:ro
      - ./ops:/ops:ro
    entrypoint:
      - /bin/sh
      - /ops/backup.sh

  backup-scheduler:
    image: postgres:16-alpine
    profiles:
      - automation
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups
      - private_documents:/private_documents:ro
      - ./ops:/ops:ro
    entrypoint:
      - /bin/sh
      - /ops/backup_scheduler.sh

  restore-verify:
    image: postgres:16-alpine
    profiles:
      - operations
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      BACKUP_ID: ${BACKUP_ID:-latest}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups:ro
      - ./ops:/ops:ro
    entrypoint:
      - /bin/sh
      - /ops/verify_restore.sh

  maintenance:
    build:
      context: ./backend
    profiles:
      - automation
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      DJANGO_PRODUCTION: ${DJANGO_PRODUCTION:-True}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      web:
        condition: service_healthy
    command:
      - sh
      - -c
      - while true; do python manage.py clearsessions && python manage.py clear_login_attempts || exit 1; sleep 86400; done

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav_data:
  private_documents: